:root {
  /* Primitives */
  --primary-50: #fef4f6;  --primary-100: #ffe3e8; --primary-200: #f9d2db; --primary-300: #ee87a9; --primary-400: #e85289;
  --primary-500: #ee2b74; --primary-600: #da0364; --primary-700: #a8024c; --primary-800: #820039; --primary-900: #5e0027;
  --secondary-50: #edfaf8; --secondary-100: #d8f0ee; --secondary-200: #9cd9d3; --secondary-300: #61c3b9; --secondary-400: #3dbab1;
  --secondary-500: #00b4aa; --secondary-600: #088079; --secondary-700: #056963; --secondary-800: #04504b; --secondary-900: #003935;
  --neutral-0: #ffffff; --neutral-50: #f5f5f5; --neutral-100: #ededed; --neutral-200: #dedede; --neutral-300: #c4c4c4;
  --neutral-400: #a8a8a8; --neutral-500: #858585; --neutral-600: #6b6b6b; --neutral-700: #575757; --neutral-800: #3e3e3e;
  --neutral-900: #1f1f1f; --neutral-1000: #000000;
  --error-50: #fff4f2; --error-100: #ffe5df; --error-600: #d1320f; --error-700: #a61f00;
  --warning-50: #fff7ef; --warning-100: #ffedda; --warning-600: #a26402; --warning-700: #804e00;
  --neutral-alpha-50: #00000080;
  --sand-50: #fcfaf3; --sand-100: #f9f5e6; --sand-200: #eae7d8;

  /* Semantic colors */
  --color-text-primary: var(--neutral-1000);
  --color-text-secondary: var(--neutral-800);
  --color-text-tertiary: var(--neutral-600);
  --color-text-disabled: var(--neutral-400);
  --color-text-inverse: var(--neutral-0);
  --color-text-brand: #ed3180;
  --color-text-success: var(--secondary-700);
  --color-text-error: var(--error-700);
  --color-text-warning: var(--warning-700);
  --color-bg-page: var(--neutral-0);
  --color-bg-subtle: var(--neutral-50);
  --color-bg-muted: var(--neutral-100);
  --color-bg-inverse: var(--neutral-900);
  --color-bg-overlay: var(--neutral-alpha-50);
  --color-bg-brand-subtle: var(--primary-50);
  --color-bg-success-subtle: var(--secondary-100);
  --color-bg-error-subtle: var(--error-100);
  --color-bg-warning-subtle: var(--warning-100);
  --color-bg-sand: var(--sand-50);
  --color-bg-sand-muted: var(--sand-100);
  --color-bg-sand-strong: var(--sand-200);
  /* gold perk badge (Latest pick-up), as in Anya's desktop 22.10.2026; not in the Figma kit yet */
  --color-bg-gold-subtle: #f6ebc8; --color-text-gold: #7a5a00;
  --color-action-primary: #ed3180;
  --color-action-primary-hover: var(--primary-600);
  --color-action-primary-pressed: var(--primary-700);
  --color-action-disabled: var(--neutral-200);
  --color-action-success: var(--secondary-600);
  --color-border-subtle: var(--neutral-200);
  --color-border-input: var(--neutral-500);
  --color-border-strong: var(--neutral-1000);
  --color-border-selected: #ed3180;
  --color-border-error: var(--error-600);
  --color-border-success: var(--secondary-600);
  --color-focus-ring: var(--neutral-1000);
  --color-icon-default: var(--neutral-1000);
  --color-icon-muted: var(--neutral-600);
  --color-icon-inverse: var(--neutral-0);
  --color-icon-brand: #ed3180;
  --color-icon-success: var(--secondary-600);
  --color-icon-warning: var(--warning-600);
  --color-icon-error: var(--error-600);
  --color-icon-disabled: var(--neutral-400);
  --color-control-off: var(--neutral-500);

  /* Type */
  --font-family: 'Rethink Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* Responsive collection, mode "mobile" */
  --font-size-display: 32px;  --line-height-display: 40px;
  --font-size-h1: 28px;       --line-height-h1: 36px;
  --font-size-h2: 22px;       --line-height-h2: 28px;
  --font-size-h3: 18px;       --line-height-h3: 24px;
  --font-size-label-lg: 16px; --line-height-label-lg: 24px;
  --font-size-body: 16px;     --line-height-body: 24px;
  --font-size-body-sm: 14px;  --line-height-body-sm: 20px;
  --font-size-label: 14px;    --line-height-label: 20px;
  --font-size-label-sm: 12px; --line-height-label-sm: 16px;
  --font-size-caption: 12px;  --line-height-caption: 16px;

  /* Space, radius */
  --space-0: 0; --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-20: 20px;
  --space-24: 24px; --space-32: 32px; --space-40: 40px; --space-48: 48px; --space-64: 64px;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 16px; --radius-full: 9999px;

  --layout-page-margin: var(--space-16);
  --layout-section-gap: var(--space-32);
  --layout-block-gap: var(--space-24);
  --layout-card-padding: var(--space-16);

  /* Effect styles */
  --shadow-raised: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.08);
  --shadow-overlay: 0 4px 12px rgba(0,0,0,.08), 0 16px 40px rgba(0,0,0,.16);
  --shadow-sticky-top: 0 -1px 2px rgba(0,0,0,.06), 0 -2px 8px rgba(0,0,0,.08);

  /* Prototype only: width of the app column on wide screens */
  --app-max-width: 480px;
}

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

/* Device insets. Inside the desktop phone frame (js/frame.js) they are faked: status bar on top, home indicator below. */
:root { --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }
/* no home indicator in the frame: the bottom inset only brings the bar's bottom padding to 22, as in the client prototype (user, 20.10.2026) */
html.is-framed { --safe-top: 47px; --safe-bottom: 6px; scrollbar-width: none; }
html.is-framed ::-webkit-scrollbar { display: none; }
html.is-framed * { scrollbar-width: none; }

body {
  font-family: var(--font-family);
  font-size: var(--font-size-body);
  line-height: var(--line-height-body);
  color: var(--color-text-primary);
  background: var(--color-bg-muted);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
}
body.is-locked { overflow: hidden; }

button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; text-align: inherit; }
img, svg { display: block; }

[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* The app column: full width on phones, centred column on wide screens (no device frame). */
#app {
  max-width: var(--app-max-width);
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--color-bg-page);
  position: relative;
  /* a column: the screen's main takes the free height, so a short screen keeps its sticky bar at the bottom (user 21.10.2026) */
  display: flex; flex-direction: column;
}
#app > main { flex: 1 0 auto; }
@media (min-width: 481px) {
  #app { box-shadow: 0 0 0 1px var(--color-border-subtle); }
}

/* Desktop phone frame: the page shows a 390×844 phone like the client prototype, the prototype runs inside it in an iframe */
.stage {
  height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: var(--color-bg-muted);
}
.stage__phone {
  width: 390px; height: 844px; flex-shrink: 0;
  border-radius: 54px; overflow: hidden; /* as in the client prototype: iPhone 12–14, 390×844 */
  background: var(--color-bg-page);
  box-shadow: 0 0 0 1px var(--neutral-300);
  transform-origin: center;
}
.stage__phone iframe { display: block; width: 100%; height: 100%; border: 0; }

/* Drawn inside the iframe, over the app */
.device-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 47px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 30px 0 34px;
  font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--color-text-primary); pointer-events: none;
}
.device-bar__time { pointer-events: auto; padding: 8px; margin: -8px; } /* system menu on click (22.10.2026) */
.device-bar.is-light { color: var(--color-text-inverse); }
.device-bar__icons { display: flex; align-items: center; gap: 6px; }
.device-bar svg { fill: currentColor; }
.device-bar__island {
  position: absolute; top: 11px; left: 50%; width: 122px; height: 35px; margin-left: -61px;
  border-radius: 18px; background: var(--neutral-1000);
}

/* Text styles */
.t-display  { font-size: var(--font-size-display); line-height: var(--line-height-display); font-weight: 700; letter-spacing: -0.01em; }
.t-h1       { font-size: var(--font-size-h1); line-height: var(--line-height-h1); font-weight: 700; letter-spacing: -0.01em; }
.t-h2       { font-size: var(--font-size-h2); line-height: var(--line-height-h2); font-weight: 700; }
.t-h3       { font-size: var(--font-size-h3); line-height: var(--line-height-h3); font-weight: 600; }
.t-label-lg { font-size: var(--font-size-label-lg); line-height: var(--line-height-label-lg); font-weight: 600; }
.t-body     { font-size: var(--font-size-body); line-height: var(--line-height-body); font-weight: 400; }
.t-body-sm  { font-size: var(--font-size-body-sm); line-height: var(--line-height-body-sm); font-weight: 400; }
.t-label    { font-size: var(--font-size-label); line-height: var(--line-height-label); font-weight: 600; }
.t-label-sm { font-size: var(--font-size-label-sm); line-height: var(--line-height-label-sm); font-weight: 600; }
.t-caption  { font-size: var(--font-size-caption); line-height: var(--line-height-caption); font-weight: 400; }

.c-secondary { color: var(--color-text-secondary); }
.c-tertiary  { color: var(--color-text-tertiary); }
.c-primary   { color: var(--color-text-primary); }
.c-brand     { color: var(--color-text-brand); }
.c-success   { color: var(--color-text-success); }

.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Icons are inline SVG with currentColor */

.vopt { position: relative; display: flex; flex-direction: column; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); background: var(--color-bg-page); overflow: hidden; }
/* 5 in the common style (28.10.2026): the picked ride green like the picked cards, the rest grey; no pink, no sand */
.vopt.is-selected { border: 2px solid var(--color-border-success); background: var(--color-bg-success-subtle); }
@media (hover: hover) { .vopt:not(.is-selected):hover { border-color: var(--color-border-input); } }
.vopt > .offer__hit { inset: 0; }
.vopt > :not(.offer__hit) { position: relative; pointer-events: none; }
.vopt__main { display: flex; align-items: center; gap: var(--space-12); padding: var(--space-16); }
.vopt.is-selected .vopt__main { padding: calc(var(--space-16) - 1px); }
.vopt__emoji { width: 32px; flex-shrink: 0; font-size: 26px; line-height: 32px; text-align: center; }
/* 5: a picture in place of an emoji (the suitcase drawn in Figma, 28.10.2026) */
.vopt__emoji img { display: block; width: 32px; height: 32px; object-fit: contain; }
.vopt__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vopt__price { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
.vopt__num { font-size: var(--font-size-h2); line-height: var(--line-height-h2); font-weight: 700; }
.vcorner5 { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-8); }
.vcorner5 > ul { flex: 1; min-width: 0; }
.vopt__perks { padding: var(--space-8) var(--space-16) var(--space-12); background: var(--color-bg-subtle); }
.vopt.is-selected .vopt__perks { padding: var(--space-8) calc(var(--space-16) - 1px) calc(var(--space-12) - 1px); background: color-mix(in srgb, var(--color-border-success) 12%, transparent); }
.vor { text-align: center; text-transform: uppercase; letter-spacing: 0.04em; }

/* 7: the flexibility on tabs over the top of the shared card; the price next to the title */
.vtabcard { display: flex; flex-direction: column; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); overflow: hidden; background: var(--color-bg-page); }
.vtabcard.is-on { border: 2px solid var(--color-border-success); background: var(--color-bg-success-subtle); }
.vtabcard > .offer, .vtabcard > .offer.is-selected { border: 0; border-radius: 0; background: none; padding: var(--layout-card-padding); }
.vtabcard > .offer > .offer__hit { inset: 0; border-radius: 0; }
.vtabs { display: flex; }
.vtabs__tab { flex: 1; min-width: 0; min-height: 44px; padding: var(--space-8) var(--space-4); text-align: center; background: var(--color-bg-muted); color: var(--color-text-secondary); }
.vtabs__tab + .vtabs__tab { border-left: 1px solid var(--color-border-subtle); }
.vtabcard.is-on .vtabs__tab { background: var(--color-action-success); color: var(--color-text-inverse); }
.vtabcard.is-on .vtabs__tab + .vtabs__tab { border-left-color: color-mix(in srgb, var(--color-text-inverse) 40%, transparent); }
.vtabs__tab[aria-selected="true"], .vtabcard.is-on .vtabs__tab[aria-selected="true"] { background: none; color: var(--color-text-secondary); }
@media (hover: hover) { .vtabs__tab:not([aria-selected="true"]):not([disabled]):hover { filter: brightness(0.95); } }
.vtabs__tab:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: -4px; }
/* no light seams (28.10.2026): under the tab row the card is painted in the tabs' colour, so the clipped corners of the edge tabs
   blend into it, not into the mint or white below; the picked tab paints its own fill; the dividers next to the picked tab
   take the colours they sit between instead of a light line */
.vtabcard { background: linear-gradient(var(--color-bg-muted), var(--color-bg-muted)) top / 100% 24px no-repeat, var(--color-bg-page); }
.vtabcard.is-on { background: linear-gradient(var(--color-action-success), var(--color-action-success)) top / 100% 24px no-repeat, var(--color-bg-success-subtle); }
.vtabs__tab[aria-selected="true"] { background: var(--color-bg-page); }
.vtabcard.is-on .vtabs__tab[aria-selected="true"] { background: var(--color-bg-success-subtle); }
.vtabs__tab[aria-selected="true"] { border-left-color: var(--color-bg-page); }
.vtabs__tab[aria-selected="true"] + .vtabs__tab { border-left-color: var(--color-bg-muted); }
.vtabcard.is-on .vtabs__tab[aria-selected="true"] { border-left-color: var(--color-bg-success-subtle); }
.vtabcard.is-on .vtabs__tab[aria-selected="true"] + .vtabs__tab { border-left-color: var(--color-action-success); }
.vcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-12); }

/* 10: the client's two products (GoOpti-Offers-2-products.html): the heading inside the card as in 8 and 9,
   the shared options on a segmented switch with prices */
.v10-seg { display: flex; flex-direction: column; gap: var(--space-8); width: 100%; }
/* the switch is ours, as in 6 (.vseg--flush: thumb slides, same hovers, paddings and radii), with the prices under the options;
   only the track is white and the thumb is an outline: green on the picked card, grey on the other (28.10.2026) */
.v10-seg .vseg, .offer.is-selected .v10-seg .vseg { background: var(--color-bg-page); }
.v10-seg .vseg__thumb { background: var(--color-bg-page); box-shadow: inset 0 0 0 2px var(--color-border-input); }
.offer.is-selected .v10-seg .vseg__thumb { box-shadow: inset 0 0 0 2px var(--color-border-success); }
/* 10: the unselected card has a darker line, as on the client's screen, and darker still on hover */
.v10-offer:not(.is-selected) { border-color: var(--color-border-input); }
@media (hover: hover) { .v10-offer:not(.is-selected):not(.is-off):hover { border-color: var(--neutral-800); } }
/* the hover is the green of our track (6 on the picked card), so it shows on the white track and differs from the mint card */
@media (hover: hover) { .v10-seg .vseg--flush .vseg__opt:not([disabled]):not([aria-checked="true"]):hover::before { background: color-mix(in srgb, var(--color-border-success) 24%, transparent); } }

/* survey: one variant per page (?v=...) */
html.is-single body { background: var(--color-bg-page); }
html.is-single .pg { padding: 0; }
html.is-single .row { padding: 0; overflow: visible; justify-content: center; }
html.is-single .col { gap: 0; }
html.is-single .col__name { display: none; }
@media (max-width: 480px), (max-height: 860px) {
  html.is-single, html.is-single body { height: 100%; overflow: hidden; }
  html.is-single .pg, html.is-single .row, html.is-single .col { height: 100%; width: 100%; }
  html.is-single .ph { width: 100%; height: 100%; border-radius: 0; box-shadow: none; --safe-top: 0px; --safe-bottom: 0px; }
  html.is-single .ph > .device-bar { display: none; }
}

GO.u = (function () {
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Dates are kept as 'YYYY-MM-DD' strings in state, times as 'HH:MM'.
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function addDays(isoStr, n) { const d = parseIso(isoStr); d.setDate(d.getDate() + n); return iso(d); }

  // "Thu 15 Oct" — no comma inside the date (copy rule)
  function fmtDay(isoStr) { const d = parseIso(isoStr); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
  function monthTitle(y, m) { return MONTH[m] + ' ' + y; }

  function toMin(hhmm) { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; }
  // Times on the service side go in quarters: a driver comes at 09:15, not at 09:05 (Phil 23.10.2026)
  function up15(min) { return Math.ceil(min / 15) * 15; }
  function down15(min) { return Math.floor(min / 15) * 15; }
  function fromMin(min) { min = ((min % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }

  // "2h 45m", "3h", "45m" (copy rule: no space after the number)
  function fmtDur(min) {
    const h = Math.floor(min / 60), m = min % 60;
    return (h ? h + 'h' : '') + (h && m ? ' ' : '') + (m ? m + 'm' : '') || '0m';
  }

  // "Today" for the prototype: ?today=2026-10-14 pins the date for screenshots; kept for the session.
  function today() {
    const p = new URLSearchParams(location.search).get('today');
    if (p && /^\d{4}-\d{2}-\d{2}$/.test(p)) { try { sessionStorage.setItem('go.today', p); } catch (e) {} return p; }
    try { const s = sessionStorage.getItem('go.today'); if (s) return s; } catch (e) {}
    return iso(new Date());
  }

  let toastTimer = null;
  function toast(msg) {
    let el = document.querySelector('.toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast'; el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('is-on'), 2200);
  }

  // Bold the matched part of a string (search suggestions)
  function highlight(text, q) {
    if (!q) return esc(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<b>' + esc(text.slice(i, i + q.length)) + '</b>' + esc(text.slice(i + q.length));
  }

})();

    justYou: 'Just you', noStops: 'No stops, no other passengers', personal: 'Free personal item up to 5 kg',
    pickUpTime: 'Pick-up time', pickUp: 'Pick-up', smsNoDot: 'Exact pick-up time by SMS the day before',
    howFlex: 'How flexible is your pick-up?', between: (a, b) => 'Pick-up between <b>' + a + ' and ' + b + '</b>',
    fixedTag: 'Fixed pick-up', fastest: 'Fastest', atNoWait: tm => 'Pick-up at ' + tm,
    paySharing: 'Pay less by sharing the van with other passengers.', pickBetween: 'Pick-up between', save: p => 'save ' + p,
    dropGuar: tm => 'Drop-off by <b>' + tm + '</b> is guaranteed.',
    privPerks: ['No other passengers.', 'Fastest and most comfortable, door-to-door.', 'Free cancellation within 24h.'],
    chooseOpt: 'Choose your option', pickUpAt: tm => 'Pick-up: <b>' + tm + '</b>', direct: 'Direct route',
    orShared: '— Or save with shared —', widerPU: 'Wider pick-up time, lower price.',
    flexPUshort: 'Flexible pick-up', fixedNoOther: 'Fixed pick-up time,<br>no other passengers',
  });
  const info = () => '<button class="icon-btn offer__info" data-act="about-ride" aria-label="About this ride">' + ic('info-outline', 20, 'icon--muted') + '</button>';
  const tag = (tone, text) => '<span class="badge badge--' + tone + '">' + esc(text) + '</span>';
  const group = (kind, body) => '<section class="offer-group">' + groupHead(kind) + '<div class="offer-group__list" role="radiogroup">' + body + '</div></section>';

  // 1 (v1) — Cards, tags, the base list: the prototype's cards, a line under the route with a tag (Best offer on 3 hours, Exact pick-up time, Just you)
  function vTags(c) {
    const d = c.d;
    const foot = (tg, text) => '<div class="offer__foot"><div class="vfoot t-body-sm c-secondary">' + (tg || '') + '<span>' + text + '</span></div>' + info() + '</div>';
    const flexFoot = o => foot(o.id === 'flex3' ? tag('success', t('bestOffer')) : '', t('within')(o.w / 60));
    return group('shared', d.flex.map(o => card(c, o, null, null, true, flexFoot(o))).join('') +
        card(c, d.fixed, null, null, true, foot(tag('neutral', t('exactPU')), t('noWait')))) +
      group('private', card(c, d.priv, null, null, true, foot(tag('success', t('justYou')), t('noStops')))) +
      trust();
  }

  // 2 (v2) — Pick-up and drop-off: the two times in columns with their names, the price large under them
  function vColumns(c) {
    const d = c.d;
    const one = (o, tg) => {
      const on = c.sel === o.id, priv = o.kind === 'private';
      // the (i) always sits in the card's bottom right corner, on the last row, down to its bottom edge (28.10.2026)
      const last = on && o.kind === 'flex' ? '<span class="vfoot t-body-sm c-secondary">' + t('smsNote') + '</span>'
        : priv ? '<div class="vfoot t-body-sm c-secondary">' + tag('success', t('justYou')) + '<span>' + t('noStops') + '</span></div>' : '';
      const priceRow = '<div class="vfoot"><span class="vbig__num nowrap">' + money(cardPrice(o)) + '</span>' + (priv ? '<span class="t-caption c-tertiary">' + t('perPerson') + '</span>' : tg || '') + '</div>';
      const foot = last ? priceRow + '<div class="offer__foot vcorner">' + last + info() + '</div>'
        : '<div class="offer__foot vcorner">' + priceRow + info() + '</div>';
      return '<div class="offer' + (on ? ' is-selected' : '') + '">' + hit(o, on) + '<div class="offer__content">' +
        '<div class="vtimes"><div><span class="t-body-sm c-secondary">' + t(o.kind === 'flex' ? 'pickBetween' : 'pickUpTime') + '</span><span class="vtime nowrap">' + pickLabel(o) + '</span></div>' +
          '<div><span class="t-body-sm c-secondary">' + t(d.out ? 'st_latest' : 'st_drop') + '</span><span class="vtime nowrap">' + fromMin(o.arr) + '</span></div></div>' +
        foot + '</div></div>';
    };
    const ch = cheapest(d.flex.concat(d.fixed));
    return group('shared', d.flex.map(o => one(o, o === ch ? tag('success', t('cheapest')) : '')).join('') + one(d.fixed, tag('neutral', t('fixedPU')))) +
      group('private', one(d.priv)) + trust();
  }

  // 3 (v3) — Flexibility tiles: one shared card asks "How flexible is your pick-up?", 1 / 2 / 3 hours on tiles with the price,
  // a grey note under the route; the fixed and the private rides are cards named with a tag
  const tick = on => on ? '<span class="vtick" aria-hidden="true">' + ic('check-circle', 28, 'icon--success') + '</span>' : '';
  function vTiles(c) {
    const d = c.d, list = d.flex.slice().reverse();
    const cur = curShared(c, d.flex, preferred(d.flex)), on = c.sel === cur.id;
    const tiles = '<div class="vtiles is-live" role="radiogroup" aria-label="' + esc(t('howFlex')) + '">' + list.map(o =>
      '<button class="vtile" role="radio" aria-checked="' + (o === cur) + '" data-act="pick" data-id="' + o.id + '"' + (o.soldOut ? ' disabled' : '') + '>' +
        '<span class="t-body-sm">' + t('win')(o.w / 60) + '</span><span class="vbig__num">' + (o.soldOut ? t('soldOut') : money(o.unit)) + '</span></button>').join('') + '</div>';
    const shared = '<div class="offer' + (on ? ' is-selected' : '') + '">' + hit(cur, on) + '<div class="offer__content vgap">' +
        '<div class="vc-head"><h3 class="offer-group__title t-h3">' + ic('shuttle', 24) + t('sharedT') + '</h3>' +
          tick(on) + '</div>' +
        '<span class="t-body">' + t('howFlex') + '</span>' + tiles + stops(c, cur) +
        // 3: the (i) in the bottom right corner of every card, on the last line, as in 2 (28.10.2026)
        // 3: no "Pick-up between …" line, the range is in the route (28.10.2026)
        '<div class="offer__foot vcorner"><div class="vnote t-body-sm c-secondary">' + t('smsNoDot') + '</div>' + info() + '</div>' +
      '</div></div>';
    const named = (o, title, tg, line) => card(c, o, null, '<div class="vc-head"><div class="vh-row"><h3 class="t-h3">' + title + '</h3>' + tg + '</div>' + tick(c.sel === o.id) + '</div>', true,
      '<div class="offer__foot vcorner"><span class="vnote t-body-sm c-secondary">' + line + '</span>' + info() + '</div>');
    return '<div class="offer-group__list" role="radiogroup">' + shared +
        // 3: no tag on the fixed card, the line under it names it (28.10.2026)
        named(d.fixed, t('sharedT'), '', t('fixedPU')) +
        named(d.priv, t('privateT'), tag('success', t('fastest')), t('noStops')) +
      '</div>' + trust();
  }

  // 4 (v4) — Panels with radios: a grey panel per type with its pitch, white radio rows; shared from fixed to 3 hours, "save €…" against fixed
  function vPanels(c) {
    const d = c.d, fx = d.fixed;
    const row = (o, label, extra, under) => {
      const on = c.sel === o.id;
      return '<button class="vrow" role="radio" aria-checked="' + on + '" data-act="pick" data-id="' + o.id + '"' + (o.soldOut ? ' disabled' : '') + '>' +
        '<span class="vradio" aria-hidden="true"></span>' +
        '<span class="vrow__main"><span class="t-body-sm c-secondary">' + label + '</span><span class="vh-row"><span class="t-label-lg nowrap">' + pickLabel(o) + '</span>' + (extra || '') + '</span></span>' +
        '<span class="vrow__price"><span class="vrow__num">' + money(cardPrice(o)) + '</span>' + (under || '') + '</span></button>';
    };
    const panel = (kind, sub, body, note) => '<section class="vpanel"><div class="vpanel__head">' + groupHead(kind) + sub + '</div>' +
      '<div class="offer-group__list" role="radiogroup">' + body + '</div>' + (note || '') + '</section>';
    // both heads alike: the pitch in body-sm under the title; private keeps only "No other passengers" on top, the rest goes under the row (28.10.2026)
    // shared: the drop-off promise back at the bottom of the panel, as private's perks (28.10.2026)
    // the shared head: the SMS promise instead of "Pay less by sharing…" (28.10.2026)
    return panel('shared', '<p class="t-body-sm c-secondary">' + t('smsNote') + '</p>',
        row(fx, t('fixedPU')) + d.flex.slice().reverse().map(o => row(o, t('pickBetween'), '', tag('success', t('save')(money(fx.unit - o.unit))))).join(''),
        '<p class="vpanel__note vnote-check t-body-sm c-secondary">' + ic('check', 16) + '<span>' + t('dropGuar')(fromMin(fx.arr)) + '</span></p>') +
      panel('private', '<p class="t-body-sm c-secondary">' + T.privPerks[0] + '</p>',
        row(d.priv, t('exactPU'), tag('success', t('justYou')), '<span class="t-caption c-tertiary">' + t('perPerson') + '</span>'),
        '<p class="vpanel__note t-body-sm c-secondary">' + T.privPerks.slice(1).join('<br>') + '</p>') +
      trust();
  }

  // 5 (v5) — Private first: the private ride on top in sand with its perks, then "Or save with shared" and the four shared rides
  // with an emoji each, from fixed to 3 hours; the prices and the picked ride in brand pink
  function vPrivFirst(c) {
    const d = c.d, p = d.priv;
    const opt = (o, emoji, title, sub, sand, perks) => {
      const on = c.sel === o.id;
      return '<div class="vopt' + (sand ? ' vopt--sand' : '') + (on ? ' is-selected' : '') + '">' + hit(o, on) +
        '<div class="vopt__main"><span class="vopt__emoji" aria-hidden="true">' + (/[/:]/.test(emoji) ? '<img src="' + emoji + '" alt="">' : emoji) + '</span>' +
          '<span class="vopt__text"><span class="' + (sand ? 't-h3' : 't-label-lg') + '">' + title + '</span><span class="t-body-sm c-secondary">' + sub + '</span></span>' +
          '<span class="vopt__price"><span class="vopt__num">' + money(cardPrice(o)) + '</span><span class="t-caption c-secondary">' + unitLabel(o) + '</span></span></div>' +
        // the private card: the (i) in the bottom right corner, on the last perk (28.10.2026)
        (perks ? '<div class="vopt__perks vcorner5"><ul class="check-list check-list--tight">' + perks.map(s => '<li class="check-item">' + ic('check', 16, 'icon--success') + '<span class="t-body-sm c-secondary">' + s + '</span></li>').join('') + '</ul>' + info() + '</div>' : '') +

  // 7 (v6) — Tabs on the card: 3 / 2 / 1 hours on tabs over the top of the flexible card, the title and the price on one line;
  // while the flexible card is not picked, the tabs are grey (the frame shows only the picked state)
  // 7: the tabs read "3h flex", "2h flex", "1h flex" (user's call, 28.10.2026; 10 too, the others keep "3 hours")
  function vTabCard(c) {
    const d = c.d;
    const cur = curShared(c, d.flex, preferred(d.flex)), on = c.sel === cur.id;
    const body = (o, title) => '<div class="offer__body"><div class="vcol"><span class="t-label-lg">' + title + '</span>' + stops(c, o) + '</div>' + price(o) + '</div>';
    const plain = (o, title) => { const s = c.sel === o.id; return '<div class="offer' + (s ? ' is-selected' : '') + '">' + hit(o, s) + '<div class="offer__content">' + body(o, title) + '</div></div>'; };
    const tabs = '<div class="vtabs is-live" role="tablist" aria-label="' + esc(t('d_label')) + '">' + d.flex.map(o =>
      '<button class="vtabs__tab t-label" role="tab" aria-selected="' + (o === cur) + '" data-act="pick" data-id="' + o.id + '"' + (o.soldOut ? ' disabled' : '') + '>' + (o.w / 60) + 'h flex</button>').join('') + '</div>';
    return group('shared', '<div class="vtabcard' + (on ? ' is-on' : '') + '">' + tabs +
          '<div class="offer">' + hit(cur, on) + '<div class="offer__content">' + body(cur, t('flexPU')) + '</div></div></div>' +
        plain(d.fixed, t('fixedPU'))) +
      // 7: the flexible card reads "Flexible pick-up time", private "The car is yours" (user's call, 28.10.2026)
      group('private', plain(d.priv, 'The car is yours')) + trust();
  }

  // ---------- 10: the client's two products, and the ride sheet behind How it works / What's included (28.10.2026) ----------
  // the client's copy, except our rules: "Fixed", no "±15 min"; the switch reads "3h flex" as the client has it (user's call, 28.10.2026)
  Object.assign(T, {
    payLess: 'Flexible at pick-up? Pay less.',
    a_flexT: 'Shared, flexible pick-up time', a_fixedT: 'Shared, fixed pick-up time', a_choose: 'Choose this ride',
    a_flexLabel: h => '<strong style="font-weight: var(--font-weight-bold); color: var(--color-text-success)">Flexible</strong> pick-up, ' + HRS(h),
    a_weSet: 'We’ll set your exact pick-up time',
    a_between: (a, b) => 'between ' + a + ' and ' + b + ' and send it to you by SMS, email &amp; app the day before the transfer.',
    a_driverAt: tm => 'Your driver picks you up at ' + tm, a_exactBy: 'Exact pick-up time by SMS, email &amp; app the day before the transfer.',
    a_landsFlex: (a, b) => 'Pick-up between ' + a + ' and ' + b + ' after your flight lands. Flight late? We wait for you.',
    a_landsAt: tm => 'Pick-up at ' + tm + ' after your flight lands. Flight late? We wait for you.',
    a_share: 'You may share the ride with other passengers, with a few short stops on the way.',
    a_direct: 'Direct, door to door, just for your group. No other passengers join, no stops on the way.',
    a_meet: 'Meet and greet included',
    a_driverUp: 'A tried and trusted driver picks you up at your address.', a_driverTo: 'A tried and trusted driver takes you to your address.',
    a_latest: (pl, tm, guar) => 'Latest drop-off at ' + pl + ' at ' + tm + (guar ? ', guaranteed.' : '.'),
    a_arrive: (pl, tm) => 'Arrival in ' + pl + ' by ' + tm + '.',
  });
  // 10 — Two products: Private, then Shared, one card each with the heading inside (icon on a tile, name, link);
  // the shared card switches 3 / 2 / 1 hours and Fixed, each with its price, the stops say Pick-up / Latest drop-off
  function vTwo(c) {
    const d = c.d, opts = d.flex.concat(d.fixed);
    const cur = curShared(c, opts, preferred(d.flex));
    // the heading inside the card as in 8 and 9 (cardHead), no hairline under it
    const head = cardHead;
    const seg = '<div class="v10-seg is-live"><span class="t-label-lg" style="font-weight: 400">' + t('payLess') + '</span>' +
      vseg(c, opts, cur, o => o.kind === 'flex' ? (o.w / 60) + 'h flex' : t('g_fixed'), true) + '</div>';
    // the price with "/ person" or "/ car" as a muted icon, as in 8
    const per = o => '<div class="offer__price"><span class="offer__amount"><span class="offer__cur">€</span><span class="offer__num">' + cardPrice(o) + '</span>' +
      '<span class="vper" aria-hidden="true">/' + ic('user', 16) + '</span><span class="sr-only">' + unitLabel(o) + '</span></span></div>';
    const box = (o, top) => {
      const on = c.sel === o.id;
      return '<div class="offer v10-offer' + (on ? ' is-selected' : '') + '">' + hit(o, on) + '<div class="offer__content vgap">' + top +
        '<div class="offer__body">' + stops(c, o) + per(o) + '</div></div></div>';
    };
    // Every GoOpti ride as in the other variants, not the client's kicker list (28.10.2026)
    return '<div class="offer-group__list" role="radiogroup">' + box(d.priv, head('private')) + box(cur, head('shared') + seg) + '</div>' + trust();
  }

  const sharedDefault = d => preferred(d.flex.concat(d.fixed));
  // survey: ?v=9a shows that one variant alone, filling the frame
  const ONLY = new URLSearchParams(location.search).get('v');
  if (ONLY) document.documentElement.classList.add('is-single');
  const VARIANTS = [
    // 1: the base list of the new edition, the others are measured against it (27.10.2026; Figma v1 of GoOpti Presentations)
    { n: '1', name: 'Cards, tags', render: vTags, def: d => d.flex.find(o => o.id === 'flex3' && !o.soldOut) || sharedDefault(d) },
    // 2: the second to weigh against 1 (27.10.2026; Figma v2)
    { n: '2', name: 'Pick-up and drop-off', render: vColumns, def: sharedDefault },
    // 3: the third (27.10.2026; Figma v3)
    { n: '3', name: 'Flexibility tiles', render: vTiles, def: sharedDefault },
    // 4: the fourth (27.10.2026; Figma v4)
    { n: '4', name: 'Panels with radios', render: vPanels, def: sharedDefault },
    // 5: the fifth (27.10.2026; Figma v5)
    { n: '5', name: 'Private first', render: vPrivFirst, def: sharedDefault },
    { n: '6', name: '1+2', render: vSplit, def: sharedDefault },
    // 7: GoOpti Presentations, Figma v6 (27.10.2026)
    { n: '7', name: 'Tabs on the card', render: vTabCard, def: sharedDefault },
    { n: '8', name: 'List, headings inside', render: vList, def: sharedDefault },
    { n: '9', name: 'Slider', render: c => vGauge(c), def: sharedDefault, roles: true, desc: true, noPrice: true, ticksTop: true },
    // 9a: 5a of the first edition, the window start times with the prices (28.10.2026)
    { n: '9a', name: 'Slider, prices', render: c => vGauge(c, true), def: sharedDefault, roles: true },
    // 10: the client's screen, GoOpti-Offers-2-products.html (28.10.2026)
    { n: '10', name: 'Two products', render: vTwo, def: sharedDefault, roles: true },
  ].filter(v => !ONLY || v.n === ONLY);

  // ---------- state of each phone ----------
  const P = VARIANTS.map(() => ({ leg: 'out', sel: {}, mem: {} }));
  function selId(p, v, d) {
    const o = find(d, p.sel[d.leg]);
    if (o && !o.soldOut) return o.id;
    const def = v.def(d);
    return def ? def.id : null;
  }
  function ctx(i) {
    const v = VARIANTS[i], p = P[i], leg = S.round ? p.leg : 'out', d = legData(leg);
    return { i, v, p, leg, d, sel: selId(p, v, d) };
  }
  function render(i, toTop) {
    const scr = document.querySelector('.ph[data-i="' + i + '"] .ph__screen');
    const y = toTop ? 0 : scr.scrollTop;
    const c = ctx(i);
    const THUMBS = '.vseg';
    const from = [...scr.querySelectorAll(THUMBS)].map(e => e.style.getPropertyValue('--i'));
    scr.innerHTML = header(c) + '<main class="offers-main">' + c.v.render(c) + '</main>' + ctaBar(c);
    // the phone is redrawn on every pick: the switch thumbs start where they were and slide to the new option
    // (put them back before anything reads the layout, scrollTop included, or the first style is already the new one)
    const slides = [...scr.querySelectorAll(THUMBS)].map((e, k) => [e, from[k], e.style.getPropertyValue('--i')]).filter(([, f, to]) => f && f !== to);
    slides.forEach(([e, f]) => e.style.setProperty('--i', f));
    scr.scrollTop = y;
    if (slides.length) { void scr.offsetWidth; slides.forEach(([e, , to]) => e.style.setProperty('--i', to)); }
  }
  function choose(i, id) {
    const p = P[i], leg = S.round ? p.leg : 'out';
    p.sel[leg] = id;
    const o = find(legData(leg), id);
    if (o && o.kind !== 'private') p.mem[leg] = id;
    render(i);
  }

  // the prototype's fake status bar (js/frame.js)
  const DEVICE_BAR = '<div class="device-bar" aria-hidden="true"><span class="device-bar__time">9:41</span><span class="device-bar__island"></span><span class="device-bar__icons">' +
    '<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>' +
    '<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.2 0 4.2.8 5.7 2.2l1.2-1.3A10.1 10.1 0 0 0 8 .8C5.3.8 2.9 1.8 1.1 3.5l1.2 1.3A8.3 8.3 0 0 1 8 2.6Zm0 3.6c1.2 0 2.3.4 3.2 1.2l1.2-1.3A6.6 6.6 0 0 0 8 4.4c-1.7 0-3.2.6-4.4 1.7l1.2 1.3c.9-.8 2-1.2 3.2-1.2Zm0 3.5c-.5 0-1 .2-1.3.5L8 11.6l1.3-1.4c-.3-.3-.8-.5-1.3-.5Z"/></svg>' +
    '<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".4"/></svg>' +
    '</span></div>';

  const row = document.getElementById('row');
  row.innerHTML = VARIANTS.map((v, i) =>
    '<div class="col"><div class="col__name"><span class="col__n">' + v.n + '</span>' + esc(v.name) + '</div>' +
    '<div class="ph' + (v.flow ? ' ph--flow' : '') + (v.tight ? ' ph--tight' : '') + '" data-i="' + i + '"><div class="ph__screen"></div>' + DEVICE_BAR + '</div></div>').join('');

  row.addEventListener('click', e => {
    // a tap on the dimmed area closes the sheet
    if (e.target.classList.contains('sheet-layer')) return closeSheet(e.target.closest('.ph'));
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const i = +b.closest('[data-i]').dataset.i;
    const p = P[i], a = b.dataset.act;
    if (a === 'pick') choose(i, b.dataset.id);
    else if (a === 'details') openSheet(i, detailsSheet(ctx(i)), b);
    else if (a === 'about') openSheet(i, aboutSheet(ctx(i), b.dataset.kind), b);
    else if (a === 'about-ride') {
      const hit = b.closest('.offer, .vopt, .vpanel, .vcard');
      const h = hit && hit.querySelector('.offer__hit[data-id], [data-act="pick"][data-id]');
      openSheet(i, aboutSheet(ctx(i), null, h && h.dataset.id), b);
    }
    else if (a === 'choose') { choose(i, b.dataset.id); closeSheet(b.closest('.ph')); }
    else if (a === 'close-sheet') closeSheet(b.closest('.ph'));
    else if (a === 'leg') { if (p.leg !== b.dataset.leg) { p.leg = b.dataset.leg; render(i, true); } }
    else if (a === 'to-return') { p.leg = 'ret'; render(i, true); }

  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.ph').forEach(closeSheet); });
  // survey: Continue asks the page around this one to open the rating (capture phase, so nothing in the prototype can swallow the click)
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-act="continue"]');
    if (b && !b.disabled && ONLY && window.parent !== window) window.parent.postMessage('survey-rate', '*');
  }, true);
  // 9: dragging the gauge picks on the fly; the phone is redrawn around the live range input, which stays in place, so the drag goes on
  function morph(a, b, keep) {
    if (!a.contains(keep)) return a.replaceWith(b);
    [...a.attributes].forEach(x => b.hasAttribute(x.name) || a.removeAttribute(x.name));
    [...b.attributes].forEach(x => a.setAttribute(x.name, x.value));
    if (a === keep) return;
    const kb = [...b.children];
    [...a.children].forEach((n, k) => morph(n, kb[k], keep));
  }
  row.addEventListener('input', e => {
    const r = e.target.closest('input[data-gauge]');
    if (!r) return;
    const i = +r.closest('[data-i]').dataset.i, p = P[i], d = ctx(i).d, o = GAUGE_OPTS(d, VARIANTS[i])[+r.value];
    p.sel[d.leg] = p.mem[d.leg] = o.id;
    const c = ctx(i), scr = r.closest('.ph__screen'), tmp = document.createElement('div');
    tmp.innerHTML = header(c) + '<main class="offers-main">' + c.v.render(c) + '</main>' + ctaBar(c);
    const kb = [...tmp.children];
    [...scr.children].forEach((n, k) => morph(n, kb[k], r));
  });

  VARIANTS.forEach((v, i) => render(i));
})();
</script>
</body>
</html>
