<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almost done · GoOpti survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="survey.css?v=4">
</head>
<body>
<main class="wrap stack">
  <div class="logo">Go<b>Opti</b></div>

  <form class="card stack" id="form">
    <h1 class="h1">Almost done</h1>
    <div>
      <label class="q__label" for="why">Anything else you'd like to tell us? <span class="muted">(optional)</span></label>
      <textarea id="why" placeholder="Which version did you like best, what could be better…"></textarea>
    </div>
    <p class="small" id="err" style="color:var(--error)" hidden></p>
    <button class="btn btn--block" type="submit" id="submit">Submit</button>
    <a class="btn btn--ghost btn--block" href="index.html">Back to all versions</a>
  </form>

  <section class="card stack" id="thanks" hidden>
    <h1 class="h1">Thank you! 🙌</h1>
    <p>Your answers are saved. You can close this page.</p>
    <a class="btn btn--ghost btn--block" href="index.html">Change my answers</a>
  </section>
</main>
<script src="survey.js?v=4"></script>
<script>
(function () {
  const m = SV.me();
  if (!m.order.some(n => m.done[n])) { location.replace('index.html'); return; }

  const form = document.getElementById('form'), err = document.getElementById('err'), submit = document.getElementById('submit');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    submit.disabled = true; submit.textContent = 'Saving…'; err.hidden = true;
    try {
      await SV.saveFinal(document.getElementById('why').value.trim());
      form.hidden = true; document.getElementById('thanks').hidden = false; scrollTo(0, 0);
    } catch (x) {
      submit.disabled = false; submit.textContent = 'Try again';
      err.textContent = 'Could not save. Check your connection and try again.'; err.hidden = false;
    }
  });
})();
</script>
</body>
</html>
